# Drives the reminder cycle every 15 minutes.
#
# WHY THIS EXISTS
#
# The engine resolves each rule's send window to a wall-clock instant in the
# business's own timezone: morning 09:00, afternoon 13:00, evening 19:00. A
# reminder becomes deliverable at that instant and not before.
#
# Vercel's Hobby plan allows ONE cron invocation per day. A single daily run can
# therefore only ever serve the one window it happens to land on. With the cron
# at 01:00 UTC (= 09:00 Asia/Singapore) the morning window was served exactly on
# time and every other window was served on the FOLLOWING day's run — afternoon
# ~20 hours late, evening ~14 hours late. Measured on live data: 935 reminders
# due at 01:00 UTC went out on time, 65 due at 05:00 UTC did not. One of the five
# seeded default rules (policy_review, afternoon) sat in that broken window out
# of the box.
#
# GitHub Actions schedules for free, so the fix costs nothing. The route it calls
# is the same one Vercel Cron calls and the same function `scripts/tick.ts` runs
# locally — swapping the driver changes no behaviour.
#
# THE SWITCH IS NO LONGER THIS FILE.
#
# This workflow was disabled, along with the Vercel cron, because turning the
# schedulers off was the only way to stop sending — and that arrangement failed
# in the way you would expect: disabling ONE of the two looked like switching
# sending off, while the other went on firing for days. It also meant only
# somebody with repository access could do it, and the app could not report the
# true state to the person actually running the business.
#
# Sending is now gated on `businesses.auto_send_enabled`, checked inside
# deliverDue — so every driver passes through it, including this one — and
# defaulting to FALSE. A tick with the flag off costs one SELECT and sends
# nothing. The operator turns it on and off from the Reminders page, and the
# banner there reports which state it is actually in.
#
# So this workflow is safe to leave enabled. It is the heartbeat as well as the
# driver: with it off, the inbox cannot distinguish a quiet queue from a stopped
# engine, and `deriveSendingStatus` reports "on, but nothing is running" — which
# is exactly what a disabled workflow should look like.
#
# STILL TRUE, and worth reading before switching sending ON:
#   - The roster is largely SEEDED DEMO DATA — fabricated Singapore numbers on
#     two businesses. Messages to them are billed and arrive nowhere. Reminders
#     addressed to a DEACTIVATED member are held rather than sent, which covers
#     the demo rows today, but an active row with a fake number is not covered.
#   - The queued backlog is mostly historical and probably wants clearing.
#   - The Vercel cron is still absent. It was a daily backstop for the case
#     where GitHub disables scheduled workflows in dormant repositories. To
#     restore it, put this back in vercel.json:
#       "crons": [{ "path": "/api/cron/process-reminders", "schedule": "0 1 * * *" }]
#     A once-daily run serves only the send window it lands on, so it is a
#     backstop and not a substitute for this file.
#
# SETUP — two repository secrets, Settings → Secrets and variables → Actions:
#   CRON_SECRET   the same value as the Vercel environment variable
#   APP_URL       https://lifecycle-app-tau.vercel.app   (no trailing slash)

name: Reminder tick

on:
  schedule:
    # Every 15 minutes. GitHub treats this as best-effort and delays it under
    # load, which is fine here: a window only needs to be noticed within the
    # hour, not to the second. It is NOT fine to widen this past ~30 minutes,
    # because the delivery loop caps at 40 reminders per run.
    - cron: "*/15 * * * *"
  # So a run can be forced from the Actions tab without waiting for the schedule
  # — useful when clearing a backlog or after fixing credentials.
  workflow_dispatch:

# A cycle claims rows before sending, so two overlapping runs are safe rather
# than duplicating work. They would still contend, so the newer one waits.
concurrency:
  group: reminder-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # "Not configured" is a setup state, not a failure — the same distinction
      # the engine itself now makes about a missing WhatsApp sender. Failing
      # here emailed a red run every 15 minutes for a repository secret nobody
      # had added yet, which trains people to ignore the one notification that
      # will matter later. The run goes green and says plainly that it did
      # nothing; every state AFTER configuration still fails loudly.
      - name: Check configuration
        id: config
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Not configured — set the APP_URL and CRON_SECRET repository secrets to enable the reminder tick. Skipping."
            {
              echo "### Reminder tick skipped"
              echo
              echo "The \`APP_URL\` and \`CRON_SECRET\` repository secrets are not set, so there is"
              echo "nothing to call. Reminders are NOT being delivered on the 15-minute schedule."
              echo
              echo "Settings → Secrets and variables → Actions, then re-run this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Call the reminder cycle
        if: steps.config.outputs.configured == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          # --max-time is below the job timeout so a hung request fails as a
          # request rather than as a cancelled job, which reports far better.
          status=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 330 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/cron/process-reminders")

          echo "HTTP ${status}"
          cat response.json
          echo

          if [ "${status}" != "200" ]; then
            # Named so the failure is readable from the Actions list without
            # opening the run. 401 means the secret drifted from Vercel's; 503
            # means CRON_SECRET is unset on the deployment itself.
            case "${status}" in
              401) echo "::error::Rejected. CRON_SECRET here does not match the one on Vercel." ;;
              503) echo "::error::The deployment has no CRON_SECRET set, so it refused to run." ;;
              *)   echo "::error::Reminder cycle returned HTTP ${status}." ;;
            esac
            exit 1
          fi

          # A 200 with ok:false means the cycle itself threw. Without this the
          # job would go green on a broken run, which is the failure mode a
          # scheduler is least able to afford.
          if ! grep -q '"ok":true' response.json; then
            echo "::error::Cycle reported a failure — see the body above."
            exit 1
          fi

      - name: Summarise
        if: always() && steps.config.outputs.configured == 'true'
        run: |
          if [ -f response.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          try:
              d = json.load(open("response.json"))
          except Exception:
              print("Cycle returned a body that was not JSON."); raise SystemExit
          if not d.get("ok"):
              print(f"**Cycle failed** — `{d.get('error', 'no error reported')}`"); raise SystemExit
          print("| metric | count |")
          print("|---|---|")
          for k in ("requeued", "planned", "inserted", "sent", "failed", "skipped"):
              if k in d:
                  print(f"| {k} | {d[k]} |")
          PY
          fi
