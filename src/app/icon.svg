<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The wordmark's mark, at favicon size: a date square with the one marked
       day that the whole product is about. Brand orange (#d96d3a) on the app's
       near-black, so it reads at 16px in a light OR dark browser chrome. -->
  <rect width="32" height="32" rx="7" fill="#1a1a20"/>
  <rect x="7" y="9" width="18" height="16" rx="2.5" fill="none" stroke="#f2efe9" stroke-width="2"/>
  <path d="M7 14h18" stroke="#f2efe9" stroke-width="2"/>
  <path d="M12 7v4M20 7v4" stroke="#f2efe9" stroke-width="2" stroke-linecap="round"/>
  <rect x="17" y="17" width="5" height="5" rx="1.2" fill="#d96d3a"/>
</svg>
